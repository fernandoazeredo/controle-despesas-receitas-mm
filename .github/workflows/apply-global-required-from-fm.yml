name: Aplicar regra global de campos obrigatorios no MM

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-global-required-from-fm.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar MM
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar regra global preservando as regras do MM
        run: python scripts/apply_global_required_mm.py

      - name: Instalar dependencias
        run: npm install --no-package-lock

      - name: Validar build
        run: npm run build

      - name: Publicar alteracoes no GitHub
        shell: bash
        run: |
          rm .github/workflows/apply-global-required-from-fm.yml
          rm scripts/apply_global_required_mm.py
          git config user.name "Fernando Azeredo - automacao"
          git config user.email "132702186+fernandoazeredo@users.noreply.github.com"
          git add src .github/workflows/apply-global-required-from-fm.yml scripts/apply_global_required_mm.py
          git commit -m "Implementa regra global de campos obrigatorios no MM"
          git push origin HEAD:main
