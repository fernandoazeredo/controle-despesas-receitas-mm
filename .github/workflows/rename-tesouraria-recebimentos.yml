name: Renomear Tesouraria Recebimentos - MM

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rename-tesouraria-recebimentos.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Atualizar nomenclatura
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('src/App.tsx'), Path('src/pages/SystemPages.tsx')]
          old = 'Tesouraria / Receitas'
          new = 'Tesouraria — Recebimentos'
          total = 0
          for p in files:
              t = p.read_text(encoding='utf-8')
              c = t.count(old)
              if c:
                  t = t.replace(old, new)
                  p.write_text(t, encoding='utf-8')
                  total += c
          if total < 2:
              raise SystemExit(f'Esperadas pelo menos 2 ocorrências; alteradas {total}')
          print(f'Alteradas {total} ocorrências')
          PY

      - name: Instalar dependencias
        run: npm install --no-package-lock

      - name: Validar build
        run: npm run build

      - name: Remover workflow temporario e publicar
        shell: bash
        run: |
          rm .github/workflows/rename-tesouraria-recebimentos.yml
          git config user.name "Fernando Azeredo - automacao"
          git config user.email "132702186+fernandoazeredo@users.noreply.github.com"
          git add src/App.tsx src/pages/SystemPages.tsx .github/workflows/rename-tesouraria-recebimentos.yml
          git commit -m "Renomeia Tesouraria para Recebimentos no MM"
          git push origin HEAD:main
