name: Deploy Firebase MM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar build
        run: npm run build

      - name: Autenticar no Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTROLE_DESPESAS_RECEITAS_MM }}

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Publicar Firestore, Storage e Hosting do MM
        run: firebase deploy --only firestore:rules,firestore:indexes,storage,hosting --project controle-despesas-receitas-mm --non-interactive

      - name: Configurar CORS do Storage MM
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cors.json <<'EOF'
          [
            {
              "origin": [
                "https://controle-despesas-receitas-mm.web.app",
                "https://controle-despesas-receitas-mm.firebaseapp.com"
              ],
              "method": ["GET", "HEAD"],
              "responseHeader": [
                "Content-Type",
                "Content-Length",
                "Content-Disposition",
                "ETag",
                "x-goog-meta-firebasestoragedownloadtokens"
              ],
              "maxAgeSeconds": 3600
            }
          ]
          EOF
          gcloud storage buckets update gs://controle-despesas-receitas-mm.firebasestorage.app --cors-file=/tmp/cors.json
          gcloud storage buckets describe gs://controle-despesas-receitas-mm.firebasestorage.app --format="yaml(cors_config)"
