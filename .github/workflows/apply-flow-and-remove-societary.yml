name: Aplicar fluxo em Dicas e remover Repasse Societario MM

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-flow-and-remove-societary.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Atualizar codigo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          t = app.read_text(encoding='utf-8')
          t = t.replace('  Handshake,\n', '')
          t = t.replace("import { SocietaryTransferSync, SocietaryTransfersPage, SocietaryTreasuryPanel } from './pages/SocietaryTransfersPage'\n", '')
          t = t.replace("  { to: '/repasse-societario', label: 'Repasse Societário', icon: Handshake, tone: 'revenue', roles: ['master', 'diretor', 'gerente', 'tesouraria'] },\n", '')
          t = t.replace('      <SocietaryTransferSync />\n', '')
          t = t.replace('          <Route path="/repasse-societario" element={<SocietaryTransfersPage />} />\n', '')
          t = t.replace('          <Route path="/tesouraria" element={<><TreasuryPage /><SocietaryTreasuryPanel /></>} />', '          <Route path="/tesouraria" element={<TreasuryPage />} />')
          app.write_text(t, encoding='utf-8')

          helpf = Path('src/pages/HelpPagesEnhanced.tsx')
          h = helpf.read_text(encoding='utf-8')
          if "OperationalFlowImage" not in h:
            pos = h.find("\nfunction Header")
            h = h[:pos] + "\nimport { OperationalFlowImage } from '../components/OperationalFlowImage'\n" + h[pos:]
          marker = "    </section>\n  </>\n}\n\nexport function HowToPageEnhanced()"
          if '<OperationalFlowImage />' not in h:
            h = h.replace(marker, "    </section>\n    <OperationalFlowImage />\n  </>\n}\n\nexport function HowToPageEnhanced()", 1)
          helpf.write_text(h, encoding='utf-8')

          p = Path('src/pages/SocietaryTransfersPage.tsx')
          if p.exists(): p.unlink()
          PY
      - run: npm install --no-package-lock
      - run: npm run build
      - name: Commitar
        shell: bash
        run: |
          rm .github/workflows/apply-flow-and-remove-societary.yml
          git config user.name "Fernando Azeredo - automacao"
          git config user.email "132702186+fernandoazeredo@users.noreply.github.com"
          git add -A
          git commit -m "Remove Repasse Societario do MM e adiciona fluxo em Dicas"
          git push origin HEAD:main
