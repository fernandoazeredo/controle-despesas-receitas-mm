name: Aplicar validacao visual inline - campos do cliente

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-inline-client-validation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar validacao visual aprovada
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 trecho, encontrado {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ALVARÁ
          p = 'src/pages/ReceivablesPageStorageV2.tsx'
          replace_once(p, "  const [busy, setBusy] = useState(false)\n  const [unidade, setUnidade]", "  const [busy, setBusy] = useState(false)\n  const [showClientValidation, setShowClientValidation] = useState(false)\n  const [unidade, setUnidade]", 'alvara-state')
          replace_once(p, "  const uploaded = uploads.flatMap((item) => item.meta ? [item.meta] : [])\n", "  const uploaded = uploads.flatMap((item) => item.meta ? [item.meta] : [])\n  const clientBankingIncomplete = !banco.trim() || !agencia.trim() || !conta.trim() || !titular.trim() || !cpf.trim()\n", 'alvara-derived')
          replace_once(p,
              "    if (status === 'enviado_tesouraria' && liquidoCliente > 0 && (!banco.trim() || !agencia.trim() || !conta.trim() || !titular.trim() || !cpf.trim())) {\n      window.alert('Para realizar o repasse ao cliente, preencha Banco, Agência, Conta, Nome/Titular e CPF.')\n      return\n    }\n",
              "    if (status === 'rascunho') setShowClientValidation(false)\n    if (status === 'enviado_tesouraria' && liquidoCliente > 0 && clientBankingIncomplete) {\n      setShowClientValidation(true)\n      window.requestAnimationFrame(() => {\n        const firstField = document.querySelector('.revenue-sheet .field-validation-error input') as HTMLInputElement | null\n        firstField?.scrollIntoView({ behavior: 'smooth', block: 'center' })\n        firstField?.focus()\n      })\n      return\n    }\n    if (status === 'enviado_tesouraria') setShowClientValidation(false)\n",
              'alvara-behavior')
          replace_once(p, "    <h3 className=\"form-section-title\">Dados bancários para crédito do cliente</h3>\n", "    <h3 className=\"form-section-title\">Dados bancários para crédito do cliente</h3>\n    {showClientValidation && liquidoCliente > 0 && clientBankingIncomplete && <div className=\"form-validation-summary\" role=\"alert\">Preencha os campos destacados para continuar.</div>}\n", 'alvara-summary')
          replace_once(p, "      <label><span>Banco *</span><input value={banco} required={liquidoCliente > 0} onChange={(e) => setBanco(e.target.value)} /></label>", "      <label className={showClientValidation && !banco.trim() ? 'field-validation-error' : ''}><span>Banco *</span><input value={banco} required={liquidoCliente > 0} aria-invalid={showClientValidation && !banco.trim()} onChange={(e) => setBanco(e.target.value)} />{showClientValidation && !banco.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>", 'alvara-banco')
          replace_once(p, "      <label><span>Agência *</span><input value={agencia} required={liquidoCliente > 0} onChange={(e) => setAgencia(e.target.value)} /></label>", "      <label className={showClientValidation && !agencia.trim() ? 'field-validation-error' : ''}><span>Agência *</span><input value={agencia} required={liquidoCliente > 0} aria-invalid={showClientValidation && !agencia.trim()} onChange={(e) => setAgencia(e.target.value)} />{showClientValidation && !agencia.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>", 'alvara-agencia')
          replace_once(p, "      <label><span>Conta *</span><input value={conta} required={liquidoCliente > 0} onChange={(e) => setConta(e.target.value)} /></label>", "      <label className={showClientValidation && !conta.trim() ? 'field-validation-error' : ''}><span>Conta *</span><input value={conta} required={liquidoCliente > 0} aria-invalid={showClientValidation && !conta.trim()} onChange={(e) => setConta(e.target.value)} />{showClientValidation && !conta.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>", 'alvara-conta')
          replace_once(p, "      <label className=\"span-2\"><span>Nome / Titular *</span><input value={titular} required={liquidoCliente > 0} onChange={(e) => setTitular(e.target.value)} /></label>", "      <label className={`span-2${showClientValidation && !titular.trim() ? ' field-validation-error' : ''}`}><span>Nome / Titular *</span><input value={titular} required={liquidoCliente > 0} aria-invalid={showClientValidation && !titular.trim()} onChange={(e) => setTitular(e.target.value)} />{showClientValidation && !titular.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>", 'alvara-titular')
          replace_once(p, "      <label><span>CPF *</span><input value={cpf} required={liquidoCliente > 0} onChange={(e) => setCpf(e.target.value)} /></label>", "      <label className={showClientValidation && !cpf.trim() ? 'field-validation-error' : ''}><span>CPF *</span><input value={cpf} required={liquidoCliente > 0} aria-invalid={showClientValidation && !cpf.trim()} onChange={(e) => setCpf(e.target.value)} />{showClientValidation && !cpf.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>", 'alvara-cpf')

          # ACORDO
          p = 'src/components/LaborAgreementReceivable.tsx'
          replace_once(p, "  const [busy, setBusy] = useState(false)\n  const [unidade, setUnidade]", "  const [busy, setBusy] = useState(false)\n  const [showClientValidation, setShowClientValidation] = useState(false)\n  const [unidade, setUnidade]", 'acordo-state')
          replace_once(p, "  const liquidoClienteRecebido = useMemo(() => realizadas.reduce((sum, row) => sum + row.liquidoCliente, 0), [realizadas])\n", "  const liquidoClienteRecebido = useMemo(() => realizadas.reduce((sum, row) => sum + row.liquidoCliente, 0), [realizadas])\n  const clientDataIncomplete = !bancoCliente.trim() || !agenciaCliente.trim() || !contaCliente.trim() || !titularCliente.trim() || !cpfCliente.trim() || !emailCliente.trim() || !telefoneCliente.trim() || !enderecoCliente.trim()\n", 'acordo-derived')
          replace_once(p,
              "    if (status === 'enviado_tesouraria' && liquidoClienteRecebido > 0 && (!titularCliente.trim() || !cpfCliente.trim() || !bancoCliente.trim() || !agenciaCliente.trim() || !contaCliente.trim() || !emailCliente.trim() || !telefoneCliente.trim() || !enderecoCliente.trim())) {\n      window.alert('Para realizar o repasse ao cliente, preencha todos os dados obrigatórios do cliente: Nome/Titular, CPF, Banco, Agência, Conta Corrente, E-mail, Telefone e Endereço.')\n      return\n    }\n",
              "    if (status === 'rascunho') setShowClientValidation(false)\n    if (status === 'enviado_tesouraria' && liquidoClienteRecebido > 0 && clientDataIncomplete) {\n      setShowClientValidation(true)\n      window.requestAnimationFrame(() => {\n        const firstField = document.querySelector('.labor-agreement-sheet .field-validation-error input') as HTMLInputElement | null\n        firstField?.scrollIntoView({ behavior: 'smooth', block: 'center' })\n        firstField?.focus()\n      })\n      return\n    }\n    if (status === 'enviado_tesouraria') setShowClientValidation(false)\n",
              'acordo-behavior')
          replace_once(p, "    <h3 className=\"form-section-title\">Dados bancários e contato do cliente</h3>\n", "    <h3 className=\"form-section-title\">Dados bancários e contato do cliente</h3>\n    {showClientValidation && liquidoClienteRecebido > 0 && clientDataIncomplete && <div className=\"form-validation-summary\" role=\"alert\">Preencha os campos destacados para continuar.</div>}\n", 'acordo-summary')
          fields = [
              ("Banco", "bancoCliente", "setBancoCliente", "text"),
              ("Agência", "agenciaCliente", "setAgenciaCliente", "text"),
              ("Conta Corrente", "contaCliente", "setContaCliente", "text"),
              ("Nome / Titular", "titularCliente", "setTitularCliente", "text"),
              ("CPF", "cpfCliente", "setCpfCliente", "text"),
              ("E-mail", "emailCliente", "setEmailCliente", "email"),
              ("Telefone", "telefoneCliente", "setTelefoneCliente", "text"),
          ]
          for label, value, setter, kind in fields:
              type_attr = ' type="email"' if kind == 'email' else ''
              old = f'      <label><span>{label} *</span><input{type_attr} value={{{value}}} required={{liquidoClienteRecebido > 0}} onChange={{(e) => {setter}(e.target.value)}} /></label>'
              new = f'      <label className={{showClientValidation && !{value}.trim() ? \'field-validation-error\' : \'\'}}><span>{label} *</span><input{type_attr} value={{{value}}} required={{liquidoClienteRecebido > 0}} aria-invalid={{showClientValidation && !{value}.trim()}} onChange={{(e) => {setter}(e.target.value)}} />{{showClientValidation && !{value}.trim() && <small className="field-validation-message">Campo obrigatório</small>}}</label>'
              replace_once(p, old, new, f'acordo-{value}')
          replace_once(p, "      <label className=\"span-2\"><span>Endereço *</span><input value={enderecoCliente} required={liquidoClienteRecebido > 0} onChange={(e) => setEnderecoCliente(e.target.value)} /></label>", "      <label className={`span-2${showClientValidation && !enderecoCliente.trim() ? ' field-validation-error' : ''}`}><span>Endereço *</span><input value={enderecoCliente} required={liquidoClienteRecebido > 0} aria-invalid={showClientValidation && !enderecoCliente.trim()} onChange={(e) => setEnderecoCliente(e.target.value)} />{showClientValidation && !enderecoCliente.trim() && <small className=\"field-validation-message\">Campo obrigatório</small>}</label>", 'acordo-endereco')

          css_path = Path('src/styles.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Validacao visual inline dos campos obrigatorios do cliente */'
          if marker not in css:
              css += '''\n\n/* Validacao visual inline dos campos obrigatorios do cliente */\n.form-validation-summary { margin: 0 0 12px; border: 1px solid rgba(220, 38, 38, .42); background: rgba(220, 38, 38, .08); color: #b91c1c; border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 800; }\n.field-validation-error > span:first-child { color: #b91c1c !important; font-weight: 800; }\n.field-validation-error input, .field-validation-error select, .field-validation-error textarea { border-color: #dc2626 !important; background: rgba(220, 38, 38, .06) !important; box-shadow: 0 0 0 3px rgba(220, 38, 38, .12) !important; animation: required-field-pulse .45s ease-out; }\n.field-validation-error input:focus, .field-validation-error select:focus, .field-validation-error textarea:focus { border-color: #b91c1c !important; box-shadow: 0 0 0 4px rgba(220, 38, 38, .18) !important; }\n.field-validation-message { color: #b91c1c; font-size: 11px; font-weight: 800; line-height: 1.2; }\n@keyframes required-field-pulse { 0% { transform: scale(.995); } 55% { transform: scale(1.01); } 100% { transform: scale(1); } }\n@media (prefers-reduced-motion: reduce) { .field-validation-error input, .field-validation-error select, .field-validation-error textarea { animation: none; } }\n'''
              css_path.write_text(css, encoding='utf-8')
          PY

      - name: Remover workflow temporario
        run: git rm .github/workflows/apply-inline-client-validation.yml

      - name: Instalar dependencias
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Commitar e publicar
        shell: bash
        run: |
          git config user.name "Fernando Azeredo - automacao"
          git config user.email "132702186+fernandoazeredo@users.noreply.github.com"
          git add -A src .github/workflows
          git commit -m "Melhora validacao visual dos campos obrigatorios"
          git push origin HEAD:main
