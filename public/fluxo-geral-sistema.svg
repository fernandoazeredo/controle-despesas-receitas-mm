<svg xmlns="http://www.w3.org/2000/svg" width="1670" height="1050" viewBox="0 0 1670 1050" role="img" aria-labelledby="title desc">
  <title id="title">Controle de Despesas e Receitas MM - Fluxo Geral do Sistema - Versão Atualizada</title>
  <desc id="desc">Fluxograma atualizado com Despesas, Recebimento de Alvarás, Tesouraria, Repasse de Alvarás, Comissões de Agentes, Nota Fiscal, Contabilidade e funcionalidades transversais.</desc>
