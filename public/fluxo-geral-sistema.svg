<svg xmlns="http://www.w3.org/2000/svg" width="1670" height="941" viewBox="0 0 1670 941" role="img" aria-labelledby="title desc">
  <title id="title">Controle de Despesas e Receitas MM — Fluxo Geral do Sistema</title>
  <desc id="desc">Fluxograma dos módulos de Despesas, Recebimento de Alvarás, Tesouraria e Receitas, Contabilidade e funcionalidades transversais.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.navy{fill:#0b3b82}.green{fill:#0c7a43}.purple{fill:#6b2e91}.orange{fill:#f07c00}.ink{fill:#11254a}.muted{fill:#4e5b6d}.white{fill:#fff}.card{fill:#fff;stroke-width:1.6}.ncard{stroke:#2e5b9a}.gcard{stroke:#2b8a57}.pcard{stroke:#8a5aaa}.ocard{stroke:#f39a3a}.dash{stroke-dasharray:5 4}.title{font:700 31px Arial,sans-serif}.sub{font:700 18px Arial,sans-serif}.module{font:700 18px Arial,sans-serif}.ct{font:700 14px Arial,sans-serif}.body{font:12px Arial,sans-serif}.small{font:11px Arial,sans-serif}.num{font:700 13px Arial,sans-serif}.arrow{stroke-width:2.5;fill:none;marker-end:url(#arr)}.navyA{stroke:#173f78}.greenA{stroke:#14834e}.purpleA{stroke:#6e3c94}.orangeA{stroke:#ef7d00}.status{font:11px Arial,sans-serif}.thin{stroke:#d8dee8;stroke-width:1}.trans{font:12px Arial,sans-serif}.center{text-anchor:middle}.bold{font-weight:700}
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker>
  </defs>
  <rect class="bg" width="1670" height="941"/>

  <!-- Cabeçalho / logo -->
  <rect x="16" y="14" width="66" height="66" rx="2" fill="#12b9e8"/>
  <text x="94" y="42" class="ink" style="font:700 30px Georgia,serif">FLÁVIO MARQUES</text>
  <text x="110" y="68" class="ink" style="font:700 16px Arial,sans-serif;letter-spacing:5px">ADVOGADOS ASSOCIADOS</text>
  <text x="835" y="40" class="title ink center">CONTROLE DE DESPESAS E RECEITAS MM</text>
  <text x="835" y="70" class="sub ink center">FLUXO GERAL DO SISTEMA</text>

  <rect x="1190" y="12" width="460" height="74" rx="12" fill="#fff" stroke="#203d72"/>
  <text x="1420" y="37" class="ct ink center">LEGENDA – STATUS</text>
  <circle cx="1216" cy="60" r="6" fill="#8e8e8e"/><text x="1230" y="64" class="status ink">Rascunho</text>
  <circle cx="1300" cy="60" r="6" fill="#ffb400"/><text x="1314" y="64" class="status ink">Em Análise</text>
  <circle cx="1400" cy="60" r="6" fill="#12a95a"/><text x="1414" y="64" class="status ink">Aprovado</text>
  <circle cx="1490" cy="60" r="6" fill="#2d8ce0"/><text x="1504" y="64" class="status ink">Concluído</text>
  <circle cx="1580" cy="60" r="6" fill="#ef3434"/><text x="1594" y="64" class="status ink">Devolvido</text>

  <!-- Módulo 1 -->
  <rect x="10" y="104" width="825" height="286" rx="10" fill="#fbfdff" stroke="#163f7f"/>
  <rect x="10" y="104" width="825" height="30" rx="10" class="navy"/>
  <text x="422" y="125" class="module white center">MÓDULO 1 – DESPESAS (TESOURARIA)</text>

  <!-- M1 cards -->
  <g transform="translate(30,170)">
    <rect width="135" height="200" rx="12" class="card ncard"/>
    <circle cx="18" cy="0" r="11" class="navy"/><text x="18" y="5" class="num white center">1</text>
    <text x="67" y="46" class="ink center" style="font:700 30px Arial">＋</text>
    <text x="67" y="76" class="ct ink center">+ DESPESA</text>
    <text x="67" y="101" class="body ink center">Tesouraria lança o</text><text x="67" y="117" class="body ink center">demonstrativo, preenche</text><text x="67" y="133" class="body ink center">dados e anexa</text><text x="67" y="149" class="body ink center">comprovantes.</text>
    <circle cx="28" cy="179" r="6" fill="#8e8e8e"/><text x="41" y="183" class="status ink">Rascunho</text>
  </g>
  <g transform="translate(185,170)">
    <rect width="140" height="200" rx="12" class="card ncard"/><circle cx="18" cy="0" r="11" class="navy"/><text x="18" y="5" class="num white center">2</text>
    <text x="70" y="46" class="ink center" style="font:700 28px Arial">▣</text><text x="70" y="75" class="ct ink center">ENVIO PARA</text><text x="70" y="92" class="ct ink center">APROVAÇÃO</text>
    <text x="70" y="119" class="body ink center">Envia para aprovação</text><text x="70" y="135" class="body ink center">da diretoria.</text>
    <circle cx="27" cy="179" r="6" fill="#ffb400"/><text x="40" y="183" class="status ink">Em Análise</text>
  </g>
  <g transform="translate(350,170)">
    <rect width="145" height="200" rx="12" class="card ncard"/><circle cx="18" cy="0" r="11" class="navy"/><text x="18" y="5" class="num white center">3</text>
    <text x="72" y="46" class="ink center" style="font:700 27px Arial">●</text><text x="72" y="75" class="ct ink center">APROVAÇÃO</text>
    <text x="72" y="103" class="body ink center">Diretoria aprova, devolve</text><text x="72" y="119" class="body ink center">para correção ou rejeita.</text>
    <circle cx="25" cy="163" r="6" fill="#12a95a"/><text x="38" y="167" class="status ink">Aprovado</text>
    <circle cx="25" cy="181" r="6" fill="#ef3434"/><text x="38" y="185" class="status ink">Devolvido</text>
  </g>
  <g transform="translate(520,170)">
    <rect width="140" height="200" rx="12" class="card ncard"/><circle cx="18" cy="0" r="11" class="navy"/><text x="18" y="5" class="num white center">4</text>
    <text x="70" y="46" class="ink center" style="font:700 28px Arial">▰</text><text x="70" y="75" class="ct ink center">PAGAMENTO</text>
    <text x="70" y="103" class="body ink center">Pagamento realizado pela</text><text x="70" y="119" class="body ink center">Tesouraria e comprovantes</text><text x="70" y="135" class="body ink center">anexados.</text>
    <circle cx="25" cy="179" r="6" fill="#2d8ce0"/><text x="38" y="183" class="status ink">Concluído</text>
  </g>
  <g transform="translate(685,170)">
    <rect width="130" height="200" rx="12" class="card ncard"/><circle cx="18" cy="0" r="11" class="navy"/><text x="18" y="5" class="num white center">5</text>
    <text x="65" y="46" class="ink center" style="font:700 28px Arial">▣</text><text x="65" y="75" class="ct ink center">ARQUIVADO</text>
    <text x="65" y="103" class="body ink center">Documentos e</text><text x="65" y="119" class="body ink center">comprovantes permanecem</text><text x="65" y="135" class="body ink center">arquivados.</text>
    <circle cx="22" cy="179" r="6" fill="#2d8ce0"/><text x="35" y="183" class="status ink">Concluído</text>
  </g>
  <path d="M165 270H185 M325 270H350 M495 270H520 M660 270H685" class="arrow navyA"/>
  <path d="M420 168V150H255V168" class="arrow navyA"/><text x="335" y="148" class="small ink center">Devolvido para correção</text>

  <!-- Módulo 2 -->
  <rect x="850" y="104" width="810" height="286" rx="10" fill="#fbfffc" stroke="#17824b"/>
  <rect x="850" y="104" width="810" height="30" rx="10" class="green"/>
  <text x="1255" y="125" class="module white center">MÓDULO 2 – RECEBIMENTO DE ALVARÁS (ORIGEM)</text>
  <g transform="translate(875,170)"><rect width="150" height="200" rx="12" class="card gcard"/><circle cx="18" cy="0" r="11" class="green"/><text x="18" y="5" class="num white center">1</text><text x="75" y="46" class="ink center" style="font:700 26px Arial">▤</text><text x="75" y="76" class="ct ink center">NOVA RECEITA</text><text x="75" y="103" class="body ink center">Origem preenche dados</text><text x="75" y="119" class="body ink center">do processo, valores e</text><text x="75" y="135" class="body ink center">documentos.</text><circle cx="28" cy="179" r="6" fill="#8e8e8e"/><text x="41" y="183" class="status ink">Rascunho</text></g>
  <g transform="translate(1070,170)"><rect width="150" height="200" rx="12" class="card gcard"/><circle cx="18" cy="0" r="11" class="green"/><text x="18" y="5" class="num white center">2</text><text x="75" y="46" class="ink center" style="font:700 28px Arial">➤</text><text x="75" y="76" class="ct ink center">ENVIAR PARA</text><text x="75" y="93" class="ct ink center">TESOURARIA</text><text x="75" y="121" class="body ink center">Envia o recebimento pronto</text><text x="75" y="137" class="body ink center">para a Tesouraria.</text><circle cx="28" cy="179" r="6" fill="#ffb400"/><text x="41" y="183" class="status ink">Em Análise</text></g>
  <g transform="translate(1265,170)"><rect width="150" height="200" rx="12" class="card gcard"/><circle cx="18" cy="0" r="11" class="green"/><text x="18" y="5" class="num white center">3</text><text x="75" y="46" class="ink center" style="font:700 28px Arial">◉</text><text x="75" y="76" class="ct ink center">RECEBIDO PELA</text><text x="75" y="93" class="ct ink center">TESOURARIA</text><text x="75" y="121" class="body ink center">Confere dados e</text><text x="75" y="137" class="body ink center">documentos.</text><circle cx="28" cy="179" r="6" fill="#ffb400"/><text x="41" y="183" class="status ink">Em Análise</text></g>
  <g transform="translate(1460,185)"><rect width="170" height="175" rx="12" class="card dash" stroke="#ef3434"/><circle cx="18" cy="0" r="11" fill="#ef3434"/><text x="18" y="5" class="num white center">4</text><text x="85" y="47" class="ct" fill="#d12626">DEVOLVER PARA</text><text x="85" y="64" class="ct" fill="#d12626">CORREÇÃO</text><text x="85" y="96" class="body ink center">Se necessário, devolve</text><text x="85" y="112" class="body ink center">à origem com observações.</text><circle cx="27" cy="151" r="6" fill="#ef3434"/><text x="40" y="155" class="status ink">Devolvido</text></g>
  <path d="M1025 270H1070 M1220 270H1265" class="arrow greenA"/>
  <path d="M1415 205H1545" class="arrow greenA"/><path d="M1545 205V170H1335V170" class="arrow greenA"/>

  <!-- Módulo 3 -->
  <rect x="10" y="404" width="1650" height="250" rx="10" fill="#fdfbff" stroke="#6f3f93"/>
  <rect x="10" y="404" width="1650" height="30" rx="10" class="purple"/>
  <text x="835" y="425" class="module white center">MÓDULO 3 – TESOURARIA / RECEITAS (CONTINUIDADE DO RECEBIMENTO)</text>
  <g id="m3" transform="translate(25,458)">
    <g transform="translate(0,0)"><rect width="150" height="170" rx="12" class="card pcard"/><circle cx="18" cy="0" r="11" class="purple"/><text x="18" y="5" class="num white center">1</text><text x="75" y="42" class="ct ink center">CONFIRMAÇÃO DO</text><text x="75" y="59" class="ct ink center">RECEBIMENTO</text><text x="75" y="90" class="body ink center">Confirma crédito, data</text><text x="75" y="106" class="body ink center">e valor recebidos.</text><circle cx="26" cy="148" r="6" fill="#ffb400"/><text x="39" y="152" class="status ink">Em Análise</text></g>
    <g transform="translate(175,0)"><rect width="150" height="170" rx="12" class="card pcard"/><circle cx="18" cy="0" r="11" class="purple"/><text x="18" y="5" class="num white center">2</text><text x="75" y="42" class="ct ink center">COMPOSIÇÃO</text><text x="75" y="59" class="ct ink center">FINANCEIRA</text><text x="75" y="88" class="body ink center">Percentuais e valores</text><text x="75" y="104" class="body ink center">calculados automaticamente.</text><circle cx="26" cy="148" r="6" fill="#ffb400"/><text x="39" y="152" class="status ink">Em Análise</text></g>
    <g transform="translate(350,0)"><rect width="180" height="170" rx="12" class="card pcard"/><circle cx="18" cy="0" r="11" class="purple"/><text x="18" y="5" class="num white center">3</text><text x="90" y="39" class="ct ink center">DESPESAS / REPASSES</text><text x="32" y="67" class="small ink">• Impostos / IRSS</text><text x="32" y="83" class="small ink">• Perícias</text><text x="32" y="99" class="small ink">• Agentes / Correspondentes</text><text x="32" y="115" class="small ink">• Custas / Tarifas / Cliente</text><circle cx="26" cy="148" r="6" fill="#ffb400"/><text x="39" y="152" class="status ink">Em Análise</text></g>
    <g transform="translate(555,0)"><rect width="150" height="170" rx="12" class="card pcard"/><circle cx="18" cy="0" r="11" class="purple"/><text x="18" y="5" class="num white center">4</text><text x="75" y="42" class="ct ink center">HONORÁRIOS MM</text><text x="75" y="59" class="ct ink center">APURADOS</text><text x="75" y="90" class="body ink center">O sistema calcula a</text><text x="75" y="106" class="body ink center">parte do escritório.</text><circle cx="26" cy="148" r="6" fill="#ffb400"/><text x="39" y="152" class="status ink">Em Análise</text></g>
    <g transform="translate(730,0)"><rect width="160" height="170" rx="12" class="card pcard"/><circle cx="18" cy="0" r="11" class="purple"/><text x="18" y="5" class="num white center">5</text><text x="80" y="42" class="ct ink center">DOCUMENTOS E</text><text x="80" y="59" class="ct ink center">COMPROVANTES</text><text x="80" y="90" class="body ink center">Anexa pagamentos, repasses,</text><text x="80" y="106" class="body ink center">notas e comprovantes.</text><circle cx="26" cy="148" r="6" fill="#ffb400"/><text x="39" y="152" class="status ink">Em Análise</text></g>
    <g transform="translate(915,0)"><rect width="150" height="170" rx="12" class="card pcard"/><circle cx="18" cy="0" r="11" class="purple"/><text x="18" y="5" class="num white center">6</text><text x="75" y="42" class="ct ink center">ENVIO PARA</text><text x="75" y="59" class="ct ink center">APROVAÇÃO</text><text x="75" y="90" class="body ink center">Envia para aprovação</text><text x="75" y="106" class="body ink center">da diretoria.</text><circle cx="26" cy="148" r="6" fill="#ffb400"/><text x="39" y="152" class="status ink">Em Análise</text></g>
    <g transform="translate(1090,0)"><rect width="150" height="170" rx="12" class="card pcard"/><circle cx="18" cy="0" r="11" class="purple"/><text x="18" y="5" class="num white center">7</text><text x="75" y="48" class="ct ink center">APROVAÇÃO</text><text x="75" y="80" class="body ink center">Aprova, devolve para</text><text x="75" y="96" class="body ink center">correção ou rejeita.</text><circle cx="24" cy="132" r="6" fill="#12a95a"/><text x="37" y="136" class="status ink">Aprovado</text><circle cx="24" cy="149" r="6" fill="#ef3434"/><text x="37" y="153" class="status ink">Devolvido</text></g>
    <g transform="translate(1265,0)"><rect width="165" height="170" rx="12" class="card pcard"/><circle cx="18" cy="0" r="11" class="purple"/><text x="18" y="5" class="num white center">8</text><text x="82" y="42" class="ct ink center">EXECUÇÃO DE</text><text x="82" y="59" class="ct ink center">REPASSES / PAGAMENTOS</text><text x="82" y="90" class="body ink center">Tesouraria realiza pagamentos</text><text x="82" y="106" class="body ink center">e anexa comprovantes.</text><circle cx="26" cy="148" r="6" fill="#2d8ce0"/><text x="39" y="152" class="status ink">Concluído</text></g>
    <g transform="translate(1455,0)"><rect width="150" height="170" rx="12" class="card pcard"/><circle cx="18" cy="0" r="11" class="purple"/><text x="18" y="5" class="num white center">9</text><text x="75" y="42" class="ct ink center">ENCERRAMENTO DO</text><text x="75" y="59" class="ct ink center">RECEBIMENTO</text><text x="75" y="90" class="body ink center">Recebimento concluído</text><text x="75" y="106" class="body ink center">e arquivado.</text><circle cx="26" cy="148" r="6" fill="#2d8ce0"/><text x="39" y="152" class="status ink">Concluído</text></g>
    <path d="M150 85H175 M325 85H350 M530 85H555 M705 85H730 M890 85H915 M1065 85H1090 M1240 85H1265 M1430 85H1455" class="arrow purpleA"/>
  </g>

  <!-- Módulo 4 -->
  <rect x="10" y="668" width="1650" height="150" rx="10" fill="#fffdf8" stroke="#ef7d00"/>
  <rect x="10" y="668" width="1650" height="30" rx="10" class="orange"/>
  <text x="835" y="689" class="module white center">MÓDULO 4 – CONTABILIDADE / EXPORTAÇÃO</text>
  <g transform="translate(35,716)">
    <g><rect width="230" height="82" rx="11" class="card ocard"/><text x="20" y="23" class="num white center"/><text x="115" y="25" class="ct ink center">DASHBOARD GERAL</text><text x="115" y="47" class="small ink center">Visão de Despesas, Receitas,</text><text x="115" y="62" class="small ink center">Honorários e Indicadores.</text></g>
    <g transform="translate(280,0)"><rect width="240" height="82" rx="11" class="card ocard"/><text x="120" y="25" class="ct ink center">MOVIMENTO DO MÊS</text><text x="120" y="47" class="small ink center">Seleciona competência e consolida</text><text x="120" y="62" class="small ink center">os movimentos.</text></g>
    <g transform="translate(570,0)"><rect width="320" height="82" rx="11" class="card ocard"/><text x="160" y="25" class="ct ink center">PACOTE CONTÁBIL</text><text x="160" y="45" class="small ink center">Planilha Excel + extrato consolidado</text><text x="160" y="60" class="small ink center">+ documentos de receitas e despesas.</text></g>
    <g transform="translate(940,0)"><rect width="260" height="82" rx="11" class="card ocard"/><text x="130" y="25" class="ct ink center">BAIXAR ZIP COMPLETO</text><text x="130" y="48" class="small ink center">Gera o pacote completo para</text><text x="130" y="63" class="small ink center">envio à Contabilidade.</text></g>
    <g transform="translate(1250,0)"><rect width="320" height="82" rx="11" class="card ocard"/><text x="160" y="25" class="ct ink center">HISTÓRICO DE ENVIO</text><text x="160" y="47" class="small ink center">Registra competências, datas,</text><text x="160" y="62" class="small ink center">responsável e status.</text></g>
    <path d="M230 41H280 M520 41H570 M890 41H940 M1200 41H1250" class="arrow orangeA"/>
  </g>

  <!-- Transversais -->
  <rect x="10" y="830" width="1260" height="95" rx="10" fill="#fbfdff" stroke="#315da2"/>
  <text x="640" y="854" class="ct ink center">FUNCIONALIDADES TRANSVERSAIS (TODOS OS MÓDULOS)</text>
  <g class="trans ink">
    <text x="55" y="886">▣ Plano de Contas</text><text x="55" y="904" class="small muted">classificação opcional</text>
    <line x1="205" y1="872" x2="205" y2="910" class="thin"/>
    <text x="235" y="886">▤ Upload de Documentos</text><text x="235" y="904" class="small muted">PDF / JPG / PNG</text>
    <line x1="405" y1="872" x2="405" y2="910" class="thin"/>
    <text x="435" y="886">⌕ Busca Avançada</text><text x="435" y="904" class="small muted">período, processo, credor</text>
    <line x1="600" y1="872" x2="600" y2="910" class="thin"/>
    <text x="630" y="886">◷ Auditoria de Ações</text><text x="630" y="904" class="small muted">quem, quando e o quê</text>
    <line x1="790" y1="872" x2="790" y2="910" class="thin"/>
    <text x="820" y="886">♙ Controle de Usuários</text><text x="820" y="904" class="small muted">e permissões</text>
    <line x1="995" y1="872" x2="995" y2="910" class="thin"/>
    <text x="1025" y="886">▥ Relatórios Gerenciais</text><text x="1025" y="904" class="small muted">e gráficos</text>
    <line x1="1170" y1="872" x2="1170" y2="910" class="thin"/>
    <text x="1200" y="886">⬡ Segurança, Backup e Restore</text><text x="1200" y="904" class="small muted">Firebase</text>
  </g>
  <rect x="1290" y="830" width="370" height="95" rx="10" fill="#fbfdff" stroke="#315da2"/>
  <text x="1475" y="854" class="ct ink center">FLUXO RESUMIDO</text>
  <text x="1475" y="881" class="body ink center">Origem cria → Tesouraria recebe → Confirma →</text>
  <text x="1475" y="899" class="body ink center">Calcula → Aprova → Executa → Arquiva →</text>
  <text x="1475" y="917" class="body ink center">Exporta para Contabilidade.</text>
